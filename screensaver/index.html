
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Retro Screensaver</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="screen">

    <div class="heading">
      <h1>RETRO DREAMS</h1>
      <p>HOVER TO START THE SCREENSAVER</p>
    </div>

    <div class="shape circle circle1"></div>
    <div class="shape circle circle2"></div>
    <div class="shape circle circle3"></div>

    <div class="shape square square1"></div>
    <div class="shape square square2"></div>

    <div class="shape diamond diamond1"></div>
    <div class="shape diamond diamond2"></div>

    <div class="shape ring ring1"></div>
    <div class="shape ring ring2"></div>

    <div class="shape star star1">✦</div>
    <div class="shape star star2">✧</div>
    <div class="shape star star3">✦</div>

    <div class="shape dot dot1"></div>
    <div class="shape dot dot2"></div>
    <div class="shape dot dot3"></div>
    <div class="shape dot dot4"></div>

    <div class="footer">
      <p>EST. 1999 &nbsp; • &nbsp; DIGITAL DAYDREAM</p>
    </div>

  </div>

</body>
</html>
